name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28.0'
          elixir-version: '1.19.0'
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # install.sh is distributed by curl | bash, so a shell bug reaches users
      # before any Elixir code runs.
      - run: bash -n install.sh && bash -n bin/roundtable
      - run: shellcheck --severity=error install.sh bin/roundtable
